{% extends 'voting/base.html' %}
{% load static %}

{% block content %}
<header>
    <div class="status">
        {% if voting_status.is_voting_active %}
            Voting is running
        {% else %}
            Cannot vote right now
        {% endif %}
    </div>
    <a href="{% url 'admin_login' %}" class="admin-icon">
        <img src="https://img.icons8.com/ios-filled/50/ffffff/user.png" alt="Admin Login">
    </a>
</header>
<main>
    <form method="post">
        {% csrf_token %}
        <button type="submit" name="cast_vote" class="btn btn-primary">Cast your vote</button>
    </form>
</main>
{% endblock %}
